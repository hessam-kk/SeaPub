name: Build desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action creates/updates the GitHub Release — needs write access.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # No tagName here: tauri-action only uploads run artifacts.
      # The release itself is created explicitly below — transparent and
      # debuggable, including the raw exe which tauri-action never attaches.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/SeaPub.exe
            src-tauri/target/release/bundle/nsis/*.exe
